<ion-header>
  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>

    <ion-title>Todo 상세</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="openEditModal()">
        수정
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
<ion-modal
  [isOpen]="isEditModalOpen"
  (didDismiss)="closeEditModal()">

  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>Todo 수정</ion-title>

        <ion-buttons slot="end">
          <ion-button (click)="closeEditModal()">
            닫기
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">

      <form [formGroup]="editForm">

        <ion-input
          label="제목"
          label-placement="stacked"
          formControlName="title"
          maxlength="20">
        </ion-input>

        <ion-textarea
          label="내용"
          label-placement="stacked"
          formControlName="content">
        </ion-textarea>
<ion-button
  expand="block"
  type="button"
  [disabled]="editForm.invalid"
  (click)="saveEdit()">
  수정 완료
</ion-button>
      </form>

    </ion-content>
  </ng-template>
</ion-modal>
  @if (todo) {
    <h2>{{ todo.title }}</h2>

    <p>{{ todo.content }}</p>

    <p>생성일: {{ todo.createdAt }}</p>
  } @else {
    <p>Todo를 찾을 수 없습니다.</p>
  }

</ion-content>
