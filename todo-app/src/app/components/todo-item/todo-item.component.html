<ion-item-sliding>

  <ion-item button (click)="openDetail()">
    <ion-label>
      <h2>{{ todo.title }}</h2>
      <p>{{ todo.content }}</p>
      <p>{{ todo.createdAt }}</p>
    </ion-label>
  </ion-item>

  <ion-item-options side="end">
    <ion-item-option
      color="danger"
      (click)="onDelete()">
      삭제
    </ion-item-option>
  </ion-item-options>

</ion-item-sliding>
